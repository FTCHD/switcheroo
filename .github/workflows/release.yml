name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  binaries:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: switcheroo-macos-aarch64
          # Intel macOS is cross-compiled on the Apple-silicon runner (macos-13 is retired).
          - os: macos-14
            target: x86_64-apple-darwin
            name: switcheroo-macos-x86_64
            cross: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: switcheroo-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: switcheroo-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: switcheroo-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Linux build dependencies (GTK, appindicator, dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          src=target/${{ matrix.target }}/release/switcheroo
          [ "${{ runner.os }}" = "Windows" ] && src="$src.exe"
          cp "$src" "out/${{ matrix.name }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # ad-hoc signature: stable identity for keychain ACLs across launches
            codesign -s - --force "out/${{ matrix.name }}"
          fi
          if [ "${{ matrix.cross }}" != "true" ]; then
            "out/${{ matrix.name }}" --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: switcheroo-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum switcheroo-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: release-bundle
          path: artifacts/*
