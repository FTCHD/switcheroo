name: release

# Manual only. Run it from the Actions tab: it builds every platform and creates (or refreshes)
# a *draft* release named after the version in Cargo.toml with the binaries and checksums
# attached. Review it on the Releases page and press Publish; GitHub creates the v<version>
# tag on this commit at that moment.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: web/dist

  binaries:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: switcheroo-macos-aarch64
          # Intel macOS is cross-compiled on the Apple-silicon runner (macos-13 is retired).
          - os: macos-14
            target: x86_64-apple-darwin
            name: switcheroo-macos-x86_64
            cross: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: switcheroo-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: switcheroo-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: switcheroo-windows-x86_64.exe
          # Windows on ARM is cross-compiled on the x64 runner; the MSVC ARM64 tools ship with it.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: switcheroo-windows-aarch64.exe
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist
      - name: Linux build dependencies (GTK, appindicator, dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          src=target/${{ matrix.target }}/release/switcheroo
          [ "${{ runner.os }}" = "Windows" ] && src="$src.exe"
          cp "$src" "out/${{ matrix.name }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # ad-hoc signature: stable identity for keychain ACLs across launches
            codesign -s - --force "out/${{ matrix.name }}"
          fi
          if [ "${{ matrix.cross }}" != "true" ]; then
            "out/${{ matrix.name }}" --version
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version from Cargo.toml
        id: version
        run: echo "version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          pattern: switcheroo-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum switcheroo-* > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release v${{ steps.version.outputs.version }}
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: v${{ steps.version.outputs.version }}
          name: Switcheroo v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
